<text x="30" y="1278" font-size="10.5" fill="#8f8f97">Visão conceitual de alto nível — não corresponde 1:1 a arquivos ou funções do código; ver docs/diagrams/its-rag-agentic-flowchart.png para o fluxo técnico detalhado.</text>
