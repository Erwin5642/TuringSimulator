<text x="1205" y="677.7" text-anchor="middle" font-size="10.6" fill="#e0a13a">documentos (offline)</text>
<rect x="1270.0" y="826.0" width="380" height="108" rx="12" fill="#262629" stroke="#4a4a52" stroke-width="1.4" />
