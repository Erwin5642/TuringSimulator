<svg width="2080" height="1300" viewBox="0 0 2080 1300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="2080" height="1300" fill="#141415" />
<text x="30" y="34" font-size="19" font-weight="600" fill="#f2f2f3">Arquitetura de Alto Nível do RAG Agentic — TuringSimulator</text>
<text x="30" y="56" font-size="12.5" fill="#c7c7cd">Visão conceitual: busca semântica, embeddings e uso do Gemini como modelo de linguagem e de embeddings.</text>
<defs><marker id="mFwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8b8b93" /></marker><marker id="mReply" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#5ad1c8" /></marker><marker id="mFallback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#e0a13a" /></marker></defs>
<rect x="40.0" y="68.0" width="220" height="84" rx="12" fill="#262629" stroke="#4a4a52" stroke-width="1.4" />
<text x="150" y="104.3" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Aluno</text>
<text x="150" y="120.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">pergunta por voz ou gesto,</text>
<text x="150" y="133.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">no ambiente imersivo</text>
<rect x="370.0" y="68.0" width="300" height="84" rx="12" fill="#262629" stroke="#4a4a52" stroke-width="1.4" />
<text x="520" y="104.3" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Cliente Unity / VR</text>
<text x="520" y="120.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">voz, gestos, avatar,</text>
<text x="520" y="133.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">fala sintetizada e legenda</text>
<rect x="740.0" y="68.0" width="300" height="84" rx="12" fill="#262629" stroke="#4a4a52" stroke-width="1.4" />
<text x="890" y="104.3" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Servidor Tutor (API)</text>
<text x="890" y="120.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">recebe a pergunta e devolve</text>
<text x="890" y="133.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">a resposta ao cliente</text>
