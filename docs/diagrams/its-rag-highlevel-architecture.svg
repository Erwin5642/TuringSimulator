<text x="705.0" y="181.7" text-anchor="middle" font-size="10.6" fill="#c7c7cd">pergunta transcrita + nível</text>
<polyline points="740,152.0 740,205 670,205 670,152.0" fill="none" stroke="#5ad1c8" stroke-width="1.7" marker-end="url(#mReply)" />
<rect x="647.1" y="195.7" width="115.75999999999999" height="18.6" fill="#141415" />
<text x="705.0" y="208.7" text-anchor="middle" font-size="10.6" fill="#5ad1c8">resposta (texto)</text>
<rect x="650.0" y="268.0" width="480" height="104" rx="12" fill="#2a2440" stroke="#5b4f8a" stroke-width="1.4" />
<text x="890" y="314.3" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Agente Conversacional</text>
<text x="890" y="330.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">persona + contexto do nível ·</text>
<text x="890" y="343.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">decide se precisa consultar a base de conhecimento</text>
