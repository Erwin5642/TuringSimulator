<text x="1460" y="494.3" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Busca Semântica (RAG)</text>
<text x="1460" y="510.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">ferramenta acionada pelo agente quando</text>
