<text x="1830" y="865.8" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Busca por</text>
<text x="1830" y="882.8" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Palavras-chave</text>
<text x="1830" y="899.0" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">fallback quando não há</text>
<text x="1830" y="912.0" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">embeddings disponíveis</text>
