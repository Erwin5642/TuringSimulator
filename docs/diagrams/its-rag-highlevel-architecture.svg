<text x="950" y="700.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">documentos sobre persona, jogo,</text>
<text x="950" y="713.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">objetos, níveis e conceitos</text>
<rect x="1300.0" y="642.0" width="320" height="96" rx="12" fill="#1f2f42" stroke="#3a6f9a" stroke-width="1.4" />
<text x="1460" y="684.3" text-anchor="middle" font-size="13.5" font-weight="650" fill="#f2f2f3">Gemini API</text>
<text x="1460" y="700.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">modelo de embeddings —</text>
<text x="1460" y="713.5" text-anchor="middle" font-size="10.8" font-weight="400" fill="#c7c7cd">transforma texto em vetores</text>
<polyline points="1460,552 1460,642" fill="none" stroke="#8b8b93" stroke-width="1.7" marker-end="url(#mFwd)" />
<rect x="1328.9" y="585.7" width="122.11999999999999" height="18.6" fill="#141415" />
<text x="1390" y="598.7" text-anchor="middle" font-size="10.6" fill="#c7c7cd">pergunta do aluno</text>
<polyline points="1110,690 1300,690" fill="none" stroke="#e0a13a" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#mFallback)" />
