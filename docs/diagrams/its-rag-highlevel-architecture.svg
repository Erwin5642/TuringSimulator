<polyline points="960,268 960,152" fill="none" stroke="#5ad1c8" stroke-width="1.7" marker-end="url(#mReply)" />
<rect x="961.2" y="200.7" width="147.56" height="18.6" fill="#141415" />
<text x="1035" y="213.7" text-anchor="middle" font-size="10.6" fill="#5ad1c8">resposta final gerada</text>
