<text x="30" y="32" text-anchor="start" font-size="19" font-weight="600" fill="#f2f2f3">Arquitetura do Sistema Tutor — TuringSimulator</text>
<text x="30" y="54" text-anchor="start" font-size="12.5" font-weight="400" fill="#c2c2c8">Cliente Unity/VR, servidor FastAPI (TuringBotAPI) e serviço externo, com o contrato REST (/session/new, /ask, /health) como fronteira entre cliente e servidor.</text>
