<text x="1020.0" y="139" text-anchor="middle" font-size="11" font-weight="400" fill="#8f8f97">Recuperação aumentada por geração</text>
<text x="1450.0" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#f2f2f3">Serviço externo</text>
<text x="1450.0" y="139" text-anchor="middle" font-size="11" font-weight="400" fill="#8f8f97">Google Gemini (LLM + embeddings)</text>
